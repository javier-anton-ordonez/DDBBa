services:
  # ==========================================
  # NODO 1: MAESTRO PRINCIPAL
  # ==========================================
  db-master-1:
    image: mysql:8.0
    container_name: ride-db-master-1
    # ID 1.
    command: --default-authentication-plugin=mysql_native_password --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --auto-increment-increment=2 --auto-increment-offset=1 --gtid-mode=ON --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ride_hailing_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data_master1:/var/lib/mysql
      # Carga de scripts iniciales (Schema y Datos) solo en el maestro 1
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - ./permissions.sql:/docker-entrypoint-initdb.d/03_permissions.sql
    networks:
      - ride-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # NODO 2: MAESTRO SECUNDARIO
  # ==========================================
  db-master-2:
    image: mysql:8.0
    container_name: ride-db-master-2
    # ID 2.
    command: --default-authentication-plugin=mysql_native_password --server-id=2 --log-bin=mysql-bin --binlog-format=ROW --auto-increment-increment=2 --auto-increment-offset=2 --gtid-mode=ON --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data_master2:/var/lib/mysql
    networks:
      - ride-network
    depends_on:
      - db-master-1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # NODO 3: LECTURA APP
  # ==========================================
  db-read-app:
    image: mysql:8.0
    container_name: ride-db-read-app
    # ID 3. Solo lectura.
    command: --default-authentication-plugin=mysql_native_password --server-id=3 --relay-log=mysql-relay-bin --read_only=1 --gtid-mode=ON --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - db_data_read_app:/var/lib/mysql
    networks:
      - ride-network
    depends_on:
      - db-master-1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # NODO 4: LECTURA DASHBOARD & BACKUPS
  # ==========================================
  db-read-dashboard:
    image: mysql:8.0
    container_name: ride-db-read-dashboard
    # ID 4. Solo lectura.
    command: --default-authentication-plugin=mysql_native_password --server-id=4 --relay-log=mysql-relay-bin --read_only=1 --gtid-mode=ON --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3309:3306"
    volumes:
      - db_data_read_dashboard:/var/lib/mysql
      - ./backups:/backups
    networks:
      - ride-network
    depends_on:
      - db-master-1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # SERVICIO PARA INICIAR LA REPLICIDAD
  
  db-init:
    image: mysql:8.0
    container_name: ride-db-init
    networks:
      - ride-network
    depends_on:
      db-master-1:
        condition: service_healthy
      db-master-2:
        condition: service_started
      db-read-app:
        condition: service_started
      db-read-dashboard:
        condition: service_started
    volumes:
      - ./init-replication.sh:/init-replication.sh
    entrypoint: ["bash", "/init-replication.sh"]
    restart: "no"


  # ==========================================
  # MONITORIZACIÓN: mysqld_exporter → Prometheus → Grafana
  # ==========================================
  mysqld-exporter:
    image: prom/mysqld-exporter
    container_name: ride-mysqld-exporter
    command:
      - "--mysqld.username=exporter:exporterpass"
      - "--mysqld.address=db-read-dashboard:3306"
    ports:
      - "9104:9104"
    networks:
      - ride-network
    depends_on:
      - db-read-dashboard

  prometheus:
    image: prom/prometheus
    container_name: ride-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ride-network
    depends_on:
      - mysqld-exporter

  # ==========================================
  # HERRAMIENTA DE GESTIÓN VISUAL
  # ==========================================
  grafana:
    image: grafana/grafana
    container_name: ride-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ride-network
    depends_on:
      - prometheus

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ride-phpmyadmin
    environment:
      # Conexión a los 4 nodos
      PMA_HOSTS: db-master-1,db-master-2,db-read-app,db-read-dashboard
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    networks:
      - ride-network
    depends_on:
      - db-master-1

volumes:
  db_data_master1:
  db_data_master2:
  db_data_read_app:
  db_data_read_dashboard:

networks:
  ride-network:
    driver: bridge


